[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voderberg-optimizer"
version = "0.5.0"
description = "Interactive SRN2 Voderberg optimizer with reconstructed three-piece shell topology"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "autograd>=1.6",
    "pygame>=2.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
voderberg-optimize = "voderberg_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
